[project]
name = "jobmatch"
version = "0.1.0"
description = "考公考编岗位筛选工具"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
    "xlrd>=2.0.2",
    "pyyaml>=6.0.3",
    "anthropic>=0.94.0",
    "sqlalchemy>=2.0.0",
    "pymysql>=1.1.0",
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "python-multipart>=0.0.27",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.1.15",
    "mypy>=1.9.0",
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
