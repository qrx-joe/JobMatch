        .main {
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 20px;
        }
        @media (max-width: 900px) {
            .main { grid-template-columns: 1fr; }
        }
        .panel {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        .panel h3 {
            margin-bottom: 15px;
            color: #333;
            font-size: 18px;
        }
        .legend {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 13px;
        }
        .legend-color {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }
        #graph {
            width: 100%;
            height: 700px;
            background: #f8f9fa;
            border-radius: 8px;
        }
        .controls {
            margin-bottom: 15px;
        }
        .controls input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
        }
        .info-box {
            background: #f0f7ff;
            border-left: 4px solid #409eff;
            padding: 15px;
            border-radius: 6px;
            margin-top: 15px;
        }
        .info-box h4 { margin-bottom: 10px; color: #409eff; }
        .info-box p { font-size: 13px; color: #666; line-height: 1.6; }
        .node-label {
            font-size: 11px;
            fill: #333;
            pointer-events: none;
        }
        .link {
            stroke: #999;
            stroke-opacity: 0.6;
        }
    </style>
</head>

                <div class="controls">

                </div>

                <div class="info-box">
                    <h4>💡 使用说明</h4>
                    <p>
                        • 大圆点 = 专业大类（如：经济学类）<br>
                        • 小圆点 = 具体专业（如：经济学）<br>
                        • 连线表示所属关系或专业关联<br>
                        • 拖拽节点可调整布局<br>
                        • 鼠标悬停查看详细信息
                    </p>
                </div>

                <div class="info-box" id="selectedInfo" style="display: none;">
                    <h4>📌 选中专业</h4>
                    <p id="selectedText"></p>
                </div>
            </div>

            <div class="panel">
                <div id="graph"></div>
            </div>

        const width = document.getElementById('graph').clientWidth;
        const height = 700;

        // 颜色映射
        const colorMap = {
            0: '#95a5a6',
            1: '#ff6b6b',  // 经济学类
            2: '#4ecdc4',  // 财政学类
            3: '#45b7d1',  // 金融学类
            4: '#96ceb4',  // 经济与贸易类
            5: '#feca57',  // 统计学类
            6: '#ff9ff3',  // 计算机类
        };

        const svg = d3.select('#graph')
            .append('svg')
            .attr('width', width)
            .attr('height', height);

        // 添加缩放
        const g = svg.append('g');
        svg.call(d3.zoom()
            .extent([[0, 0], [width, height]])
            .scaleExtent([0.5, 4])
            .on('zoom', (event) => g.attr('transform', event.transform)));

        // 创建力导向模拟
        const simulation = d3.forceSimulation(graphData.nodes)
            .force('link', d3.forceLink(graphData.links).id(d => d.id).distance(100))
            .force('charge', d3.forceManyBody().strength(-300))
            .force('center', d3.forceCenter(width / 2, height / 2))
            .force('collision', d3.forceCollide().radius(d => d.type === 'category' ? 40 : 25));

        // 绘制连线
        const link = g.append('g')
            .selectAll('line')
            .data(graphData.links)
            .enter().append('line')
            .attr('class', 'link')
            .attr('stroke-width', d => d.type === 'belongs_to' ? 2 : 1)
            .attr('stroke-dasharray', d => d.type === 'related' ? '5,5' : null);

        // 绘制节点
        const node = g.append('g')
            .selectAll('g')
            .data(graphData.nodes)
            .enter().append('g')
            .call(d3.drag()
                .on('start', dragstarted)
                .on('drag', dragged)
                .on('end', dragended));

        // 节点圆圈
        node.append('circle')
            .attr('r', d => d.type === 'category' ? 30 : 18)
            .attr('fill', d => colorMap[d.group] || '#95a5a6')
            .attr('stroke', '#fff')
            .attr('stroke-width', 2)
            .style('cursor', 'pointer');

        // 节点文字
        node.append('text')
            .attr('class', 'node-label')
            .attr('dy', d => d.type === 'category' ? 45 : 28)
            .attr('text-anchor', 'middle')
            .text(d => d.name.length > 6 ? d.name.substring(0, 5) + '...' : d.name);

        // 鼠标交互
        node.on('mouseover', function(event, d) {
            d3.select(this).select('circle').attr('stroke', '#333').attr('stroke-width', 3);

            // 高亮相关节点
            const connected = new Set();
            graphData.links.forEach(l => {
                if (l.source.id === d.id) connected.add(l.target.id);
                if (l.target.id === d.id) connected.add(l.source.id);
            });

            node.style('opacity', n => n.id === d.id || connected.has(n.id) ? 1 : 0.2);
            link.style('opacity', l => l.source.id === d.id || l.target.id === d.id ? 1 : 0.1);
        })
        .on('mouseout', function() {
            d3.select(this).select('circle').attr('stroke', '#fff').attr('stroke-width', 2);
            node.style('opacity', 1);
            link.style('opacity', 1);
        })
        .on('click', function(event, d) {
            const info = document.getElementById('selectedInfo');
            const text = document.getElementById('selectedText');
            info.style.display = 'block';

            let html = `<strong>名称：</strong>${d.name}<br>`;
            html += `<strong>类型：</strong>${d.type === 'category' ? '专业大类' : '具体专业'}<br>`;
            if (d.code) html += `<strong>代码：</strong>${d.code}<br>`;
            if (d.category) html += `<strong>所属大类：</strong>${d.category}<br>`;

            // 查找关联专业
            const related = graphData.links
                .filter(l => l.source.id === d.id || l.target.id === d.id)
                .map(l => l.source.id === d.id ? l.target.name : l.source.name);

            if (related.length > 0) {
                html += `<strong>关联专业：</strong>${related.slice(0, 5).join('、')}`;
            }

            text.innerHTML = html;
        });

        // 搜索功能
        document.getElementById('searchInput').addEventListener('input', function(e) {
            const keyword = e.target.value.trim();
            if (!keyword) {
                node.style('opacity', 1);
                link.style('opacity', 1);
                return;
            }

            node.style('opacity', d => d.name.includes(keyword) ? 1 : 0.1);
            link.style('opacity', 0.1);
        });

        // 更新位置
        simulation.on('tick', () => {
            link
                .attr('x1', d => d.source.x)
                .attr('y1', d => d.source.y)
                .attr('x2', d => d.target.x)
                .attr('y2', d => d.target.y);

            node.attr('transform', d => `translate(${d.x},${d.y})`);
        });

        function dragstarted(event, d) {
            if (!event.active) simulation.alphaTarget(0.3).restart();
            d.fx = d.x;
            d.fy = d.y;
        }

        function dragged(event, d) {
            d.fx = event.x;
            d.fy = event.y;
        }

        function dragended(event, d) {
            if (!event.active) simulation.alphaTarget(0);
            d.fx = null;
            d.fy = null;
        }
    </script>
