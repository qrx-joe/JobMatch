# 数据文件配置
data:
  # 当前年份岗位表路径（包含多sheet）
  jobs_file: "2025年岗位表.xlsx"

  # 输出目录
  output_dir: "reports"

# 个人基本信息
profile:
  专业: "经济学"
  学历: "本科"           # 大专 / 本科 / 研究生
  学位: "学士"           # 无 / 学士 / 硕士 / 博士
  性别: "女"             # 男 / 女
  户籍: "吕梁市"         # 具体城市或空字符串

  # 是否应届毕业生（2026年毕业）
  是否应届: false

  # 政治面貌
  政治面貌: "群众"       # 群众 / 共青团员 / 中共党员 / 中共预备党员

  # 相关资格证书（你拥有的证书）
  相关资格:
    # - 教师资格证
    # - 法律职业资格证书
    # - 医师资格证
    # - 护士资格证
    # - 会计证
    # - 注册会计师
    # - 建造师证
    # - 法律职业资格证
    # 没有就留空列表: []

  # 工作年限（年）
  工作年限: 0

  # ========== 新增筛选条件 ==========
  # 英语等级：无 / CET4 / 四级 / CET6 / 六级
  英语等级: ""

  # 计算机等级：无 / 一级 / 二级 / 三级 / 四级
  计算机等级: ""

  # 身体状况：正常 / 色盲 / 色弱 / 近视 / 远视 等
  身体状况: ""

  # 是否退伍军人
  是否退伍军人: false

  # 是否西部计划志愿者
  是否西部计划志愿者: false

  # 是否曾参与基层服务项目（三支一扶、村官、特岗教师等）
  是否基层服务项目人员: false

  # 院校层次："" / 985 / 211 / 普通本科
  院校层次: ""

# 意向设置
preference:
  # 意向城市（优先显示这些城市的岗位）
  意向城市:
    - "吕梁市"
    - "太原市"
    # - "大同市"
    # - "忻州市"
    # - "晋中市"
    # - "阳泉市"
    # - "长治市"
    # - "晋城市"
    # - "临汾市"
    # - "运城市"
    # 空列表表示全省：[]

  # 服务类别偏好（留空表示不限）
  服务类别: []
    # - "支农"
    # - "支医"
    # - "支教"
    # - "帮扶乡村振兴"
    # - "水利"
    # - "林业"
    # - "就业和社会保障服务平台"

# 筛选规则（严格的排除条件）
rules:
  # 专业匹配模式
  专业匹配模式: "智能"     # 精确 / 包含 / 智能

  # 学历匹配
  学历匹配: "向下兼容"     # 本科可以报"大专及以上"

  # 户籍匹配规则
  户籍匹配:
    # strict = 只报不限户籍或限本户籍的岗位
    # loose = 也显示限其他户籍的岗位（但会标记）
    # disabled = 不考虑户籍限制
    模式: "loose"
    优先显示户籍地: true      # 优先显示户籍地岗位

  # 性别限制处理
  性别限制:
    # strict = 只报不限性别或限本性别的岗位
    # loose = 也显示限异性别的岗位（但会标记为不符合）
    模式: "strict"

  # 相关资格匹配
  相关资格匹配:
    # strict = 岗位要求资格必须拥有
    # loose = 没有资格也能报"有相关资格优先"的岗位
    # disabled = 不考虑资格要求
    模式: "loose"

  # 应届生要求
  应届生匹配:
    # strict = 只报限应届或不限的岗位
    # loose = 也显示限往届的岗位
    模式: "loose"

  # 政治面貌匹配
  政治面貌匹配:
    # strict = 党员才能报限党员岗位
    # loose = 不考虑政治面貌限制
    模式: "loose"

# 过滤选项（软性筛选，影响显示但不强制排除）
filter:
  # 最大竞争比（高于此值的岗位标记为不推荐）
  最大竞争比: 100

  # 最低招募人数（低于此值的岗位标记）
  最低招募人数: 1

  # 排除关键词（岗位描述中包含这些词就标记）
  排除关键词: []
    # - "夜班"
    # - "偏远"
    # - "艰苦"

# 历史数据配置（支持多年度对比分析）
historical_data:
  # 是否启用历史数据分析
  启用: true

  # 当前年份
  当前年份: 2025

  # 历年统计数据文件（按年份配置）
  历年统计:
    2023:
      文件路径: "data/historical/2023年统计.xlsx"
      上岸分数线: 65.5
      平均竞争比: 15.2
    2024:
      文件路径: "data/historical/2024年统计.xlsx"
      上岸分数线: 68.0
      平均竞争比: 18.5
    2025:
      文件路径: "data/historical/2025年统计.xlsx"
      上岸分数线: null      # 当前年份尚未结束
      平均竞争比: null

  # 历史数据分析选项
  分析选项:
    # 预测今年上岸分数（基于历年趋势）
    预测分数: true

    # 竞争趋势分析
    竞争趋势: true

    # 建议报考策略（conservative-保守/normal-正常/aggressive-激进）
    报考策略: "conservative"

    # 你的预估分数（用于计算上岸概率）
    预估分数: 70.0

# 输出设置
output:
  # 排序方式
  排序方式: "匹配度降序"

  # 输出模式
  输出模式: "全量标记"      # 全量标记 / 仅匹配

  # 显示字段
  显示字段:
    - 所属地市
    - 服务单位
    - 岗位类型
    - 服务类别
    - 招募人数
    - 学历要求
    - 学位要求
    - 专业要求
    - 相关资格
    - 其他要求
    - 联系电话
    - 填报人数
    - 缴费人数
    - 竞争比
    - 匹配度
    - 不匹配原因

  # 报告包含历史数据
  包含历史分析: true
