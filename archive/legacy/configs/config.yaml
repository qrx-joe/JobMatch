# 个人条件配置
profile:
  专业: "经济学"
  学历: "本科"
  学位: "学士"
  性别: "女"
  户籍: "吕梁市"
  相关资格: []

# 意向设置
preference:
  # 意向城市优先级（顺序表示优先级）
  意向城市: ["吕梁市", "太原市"]
  # 空数组表示全省所有城市
  # 意向城市: []

  # 服务类别偏好（留空表示不限）
  服务类别: []

# 匹配规则
rules:
  专业匹配模式: "智能"  # 精确 / 包含 / 智能
  学历匹配: "向下兼容"  # 本科可以报"大专及以上"
  户籍匹配: "优先"  # 优先匹配户籍地岗位，也显示不限户籍的

# 输出设置
output:
  # 排序方式
  排序方式: "匹配度降序"  # 匹配度降序 / 竞争比升序 / 竞争比降序

  # 输出所有岗位还是仅匹配的
  输出模式: "全量标记"  # 全量标记 / 仅匹配

  # 显示字段
  显示字段:
    - 所属地市
    - 服务单位
    - 岗位类型
    - 服务类别
    - 招募人数
    - 学历要求
    - 学位要求
    - 专业要求
    - 相关资格
    - 其他要求
    - 联系电话
    - 填报人数
    - 缴费人数
    - 竞争比
    - 匹配度
    - 不匹配原因
