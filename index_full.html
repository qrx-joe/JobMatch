<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>三支一扶智能选岗系统 V2</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            color: white;
            padding: 40px 20px;
        }

        .header h1 {
            font-size: 42px;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .header p {
            font-size: 18px;
            opacity: 0.9;
        }

        .status-bar {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .status-item {
            background: rgba(255,255,255,0.2);
            backdrop-filter: blur(10px);
            padding: 10px 20px;
            border-radius: 20px;
            color: white;
            font-size: 14px;
        }

        .status-item.active {
            background: rgba(40, 167, 69, 0.8);
        }

        .main-grid {
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: 24px;
        }

        @media (max-width: 1024px) {
            .main-grid {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .card-header {
            background: #f8f9fa;
            padding: 20px;
            border-bottom: 1px solid #e9ecef;
        }

        .card-header h2 {
            font-size: 18px;
            color: #495057;
        }

        .card-body {
            padding: 24px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #495057;
            font-size: 14px;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.2s;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
        }

        .checkbox-group input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: #667eea;
        }

        .btn {
            padding: 14px 28px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #f8f9fa;
            color: #495057;
            border: 1px solid #dee2e6;
        }

        .btn-secondary:hover {
            background: #e9ecef;
        }

        .btn-block {
            width: 100%;
            justify-content: center;
        }

        .btn-group {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }

        .results-section {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 16px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
        }

        .stat-card h3 {
            font-size: 32px;
            margin-bottom: 4px;
        }

        .stat-card p {
            font-size: 14px;
            opacity: 0.9;
        }

        .job-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .job-card {
            border: 2px solid #e9ecef;
            border-radius: 12px;
            padding: 20px;
            transition: all 0.3s;
            cursor: pointer;
        }

        .job-card:hover {
            border-color: #667eea;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.15);
        }

        .job-card.perfect {
            border-color: #28a745;
            background: #f8fff9;
        }

        .job-card.partial {
            border-color: #ffc107;
            background: #fffdf5;
        }

        .job-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
        }

        .job-title {
            font-size: 18px;
            font-weight: 600;
            color: #333;
        }

        .job-location {
            color: #666;
            font-size: 14px;
            margin-top: 4px;
        }

        .job-badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .job-badge.perfect {
            background: #d4edda;
            color: #155724;
        }

        .job-badge.partial {
            background: #fff3cd;
            color: #856404;
        }

        .job-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 12px;
            margin-top: 12px;
            font-size: 14px;
        }

        .job-detail {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .job-detail .label {
            color: #888;
        }

        .job-reasons {
            margin-top: 12px;
            padding: 12px;
            background: #f8f9fa;
            border-radius: 8px;
            font-size: 13px;
        }

        .job-reasons .title {
            color: #667eea;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .loading {
            text-align: center;
            padding: 60px;
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            border-bottom: 2px solid #e9ecef;
            padding-bottom: 8px;
        }

        .tab {
            padding: 10px 20px;
            border: none;
            background: none;
            cursor: pointer;
            font-size: 14px;
            color: #666;
            border-radius: 6px;
            transition: all 0.2s;
        }

        .tab:hover {
            background: #f8f9fa;
        }

        .tab.active {
            background: #667eea;
            color: white;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* 专业对比区域 */
        .compare-section {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 20px;
            margin-top: 20px;
        }

        .compare-inputs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 16px;
        }

        .compare-result {
            background: white;
            border-radius: 8px;
            padding: 16px;
        }

        .compare-path {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 12px;
            flex-wrap: wrap;
        }

        .path-node {
            background: #667eea;
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
        }

        .path-arrow {
            color: #667eea;
            font-size: 20px;
        }

        .empty-state {
            text-align: center;
            padding: 60px;
            color: #888;
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }

        @media print {
            body { background: white; }
            .sidebar { display: none; }
            .job-card { break-inside: avoid; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>三支一扶智能选岗系统</h1>
            <p>AI语义匹配 + 专业图谱 + 智能推荐</p>
        </div>

        <div class="status-bar">
            <div class="status-item active" id="status-local">本地匹配: 可用</div>
            <div class="status-item" id="status-llm">Claude API: 检测中...</div>
            <div class="status-item active">专业图谱: 可用</div>
        </div>

        <div class="main-grid">
            <div class="sidebar">
                <div class="card">
                    <div class="card-header">
                        <h2>我的档案</h2>
                    </div>
                    <div class="card-body">
                        <div class="form-group">
                            <label>专业名称</label>
                            <input type="text" id="userMajor" placeholder="例如：金融学" value="金融学">
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label>学历</label>
                                <select id="userEducation">
                                    <option value="本科" selected>本科</option>
                                    <option value="硕士研究生">硕士研究生</option>
                                    <option value="博士研究生">博士研究生</option>
                                    <option value="专科">专科</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label>学位</label>
                                <select id="userDegree">
                                    <option value="学士" selected>学士</option>
                                    <option value="硕士">硕士</option>
                                    <option value="博士">博士</option>
                                </select>
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label>性别</label>
                                <select id="userGender">
                                    <option value="">不限</option>
                                    <option value="男">男</option>
                                    <option value="女">女</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label>户籍</label>
                                <input type="text" id="userHousehold" placeholder="例如：济南市">
                            </div>
                        </div>

                        <div class="checkbox-group">
                            <input type="checkbox" id="isFreshGraduate">
                            <label for="isFreshGraduate">应届毕业生</label>
                        </div>

                        <div class="form-group">
                            <label>意向城市（可多选）</label>
                            <input type="text" id="targetCities" placeholder="例如：济南市, 青岛市">
                        </div>

                        <div class="form-group">
                            <label>最大竞争比</label>
                            <input type="number" id="maxRatio" value="50" min="1">
                        </div>

                        <div class="btn-group">
                            <button class="btn btn-primary btn-block" onclick="searchJobs()">
                                AI智能匹配
                            </button>
                        </div>
                    </div>
                </div>

                <!-- 专业对比卡片 -->
                <div class="card" style="margin-top: 20px;">
                    <div class="card-header">
                        <h2>专业对比</h2>
                    </div>
                    <div class="card-body">
                        <div class="compare-inputs">
                            <div class="form-group">
                                <input type="text" id="compareMajor1" placeholder="专业1" value="金融学">
                            </div>
                            <div class="form-group">
                                <input type="text" id="compareMajor2" placeholder="专业2" value="经济学">
                            </div>
                        </div>
                        <button class="btn btn-secondary btn-block" onclick="compareMajors()">
                            对比关系
                        </button>
                        <div id="compareResult" class="compare-result" style="display: none; margin-top: 16px;">
                            <!-- 对比结果 -->
                        </div>
                    </div>
                </div>
            </div>

            <div class="results-section">
                <div class="card">
                    <div class="tabs">
                        <button class="tab active" onclick="switchTab('jobs')">匹配岗位</button>
                        <button class="tab" onclick="switchTab('graph')">专业图谱</button>
                        <button class="tab" onclick="switchTab('analysis')">分析报告</button>
                    </div>

                    <!-- 岗位列表 -->
                    <div id="jobsTab" class="tab-content active">
                        <div class="card-body">
                            <div id="statsContainer" class="stats-grid" style="display: none;">
                                <!-- 统计卡片 -->
                            </div>

                            <div id="jobsContainer">
                                <div class="empty-state">
                                    <div class="empty-state-icon">📋</div>
                                    <p>填写左侧档案信息，点击"AI智能匹配"开始</p>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- 专业图谱 -->
                    <div id="graphTab" class="tab-content">
                        <div class="card-body">
                            <div style="text-align: center; padding: 40px;">
                                <p>专业关系图谱功能需要在完整版中查看</p>
                                <p style="color: #888; margin-top: 12px;">请打开 major_graph_enhanced.py 查看交互式图谱</p>
                            </div>
                        </div>
                    </div>

                    <!-- 分析报告 -->
                    <div id="analysisTab" class="tab-content">
                        <div class="card-body">
                            <div id="analysisContent">
                                <div class="empty-state">
                                    <div class="empty-state-icon">📊</div>
                                    <p>完成岗位匹配后生成分析报告</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // API基础URL
        const API_URL = 'http://localhost:8000';

        // 检查API状态
        async function checkStatus() {
            try {
                const response = await fetch(`${API_URL}/api/status`);
                const data = await response.json();

                if (data.claude_api === 'available') {
                    document.getElementById('status-llm').classList.add('active');
                    document.getElementById('status-llm').textContent = 'Claude API: 可用';
                } else {
                    document.getElementById('status-llm').textContent = 'Claude API: 不可用';
                }
            } catch (e) {
                document.getElementById('status-llm').textContent = 'Claude API: 未连接';
            }
        }

        // 搜索岗位
        async function searchJobs() {
            const container = document.getElementById('jobsContainer');
            container.innerHTML = '<div class="loading"><div class="loading-spinner"></div><p>AI正在分析匹配...</p></div>';

            const request = {
                profile: {
                    major: document.getElementById('userMajor').value,
                    education: document.getElementById('userEducation').value,
                    degree: document.getElementById('userDegree').value,
                    gender: document.getElementById('userGender').value,
                    household: document.getElementById('userHousehold').value,
                    is_fresh_graduate: document.getElementById('isFreshGraduate').checked,
                    target_cities: document.getElementById('targetCities').value.split(',').map(s => s.trim()).filter(s => s)
                },
                filters: {
                    max_competition_ratio: parseInt(document.getElementById('maxRatio').value) || 100
                },
                use_llm: true
            };

            try {
                const response = await fetch(`${API_URL}/api/jobs/search`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(request)
                });

                const data = await response.json();
                displayJobs(data);
                displayStats(data.summary);
                displayAnalysis(data);
            } catch (e) {
                container.innerHTML = `<div class="empty-state"><p>请求失败: ${e.message}</p><p style="color: #888;">请确保后端服务已启动 (python app_full.py)</p></div>`;
            }
        }

        // 显示岗位列表
        function displayJobs(data) {
            const container = document.getElementById('jobsContainer');
            const jobs = data.jobs || [];

            if (jobs.length === 0) {
                container.innerHTML = '<div class="empty-state"><p>未找到匹配岗位</p></div>';
                return;
            }

            container.innerHTML = jobs.map(job => `
                <div class="job-card ${job.match_level === '完全符合' ? 'perfect' : job.match_level === '可能符合' ? 'partial' : ''}">
                    <div class="job-header">
                        <div>
                            <div class="job-title">${job.unit}</div>
                            <div class="job-location">${job.sheet_name} | ${job.job_type}</div>
                        </div>
                        <span class="job-badge ${job.match_level === '完全符合' ? 'perfect' : 'partial'}">${job.match_level}</span>
                    </div>
                    <div class="job-details">
                        <div class="job-detail">
                            <span class="label">专业要求:</span>
                            <span>${job.major}</span>
                        </div>
                        <div class="job-detail">
                            <span class="label">学历要求:</span>
                            <span>${job.education}</span>
                        </div>
                        <div class="job-detail">
                            <span class="label">招募人数:</span>
                            <span>${job.recruit_count}人</span>
                        </div>
                        <div class="job-detail">
                            <span class="label">竞争比:</span>
                            <span>${job.competition_ratio > 0 ? job.competition_ratio + ':1' : '暂无'}</span>
                        </div>
                        <div class="job-detail">
                            <span class="label">匹配分数:</span>
                            <span style="color: #667eea; font-weight: 600;">${job.match_score}分</span>
                        </div>
                    </div>
                    ${job.match_reasons && job.match_reasons.length > 0 ? `
                        <div class="job-reasons">
                            <div class="title">匹配理由</div>
                            <ul style="margin-left: 16px; margin-top: 4px;">
                                ${job.match_reasons.map(r => `<li>${r}</li>`).join('')}
                            </ul>
                        </div>
                    ` : ''}
                </div>
            `).join('');
        }

        // 显示统计
        function displayStats(summary) {
            const container = document.getElementById('statsContainer');
            container.style.display = 'grid';
            container.innerHTML = `
                <div class="stat-card">
                    <h3>${summary.total}</h3>
                    <p>匹配岗位</p>
                </div>
                <div class="stat-card">
                    <h3>${summary.perfect}</h3>
                    <p>完全符合</p>
                </div>
                <div class="stat-card">
                    <h3>${summary.partial}</h3>
                    <p>可能符合</p>
                </div>
                <div class="stat-card">
                    <h3>${summary.avg_score.toFixed(0)}</h3>
                    <p>平均分数</p>
                </div>
            `;
        }

        // 显示分析
        function displayAnalysis(data) {
            const container = document.getElementById('analysisContent');
            container.innerHTML = `
                <h3 style="margin-bottom: 16px;">匹配分析</h3>
                <p style="margin-bottom: 12px;">本次匹配共分析 ${data.summary.total} 个岗位：</p>
                <ul style="margin-left: 24px; line-height: 2;">
                    <li><strong>${data.summary.perfect}</strong> 个岗位完全符合你的条件</li>
                    <li><strong>${data.summary.partial}</strong> 个岗位可能符合（建议关注）</li>
                    <li>平均匹配分数为 <strong>${data.summary.avg_score.toFixed(1)}</strong> 分</li>
                </ul>
                <div style="margin-top: 24px;">
                    <button class="btn btn-primary" onclick="exportReport('html')">导出HTML报告</button>
                    <button class="btn btn-secondary" onclick="exportReport('json')" style="margin-left: 12px;">导出JSON数据</button>
                </div>
            `;
        }

        // 专业对比
        async function compareMajors() {
            const major1 = document.getElementById('compareMajor1').value;
            const major2 = document.getElementById('compareMajor2').value;
            const resultDiv = document.getElementById('compareResult');

            try {
                const response = await fetch(`${API_URL}/api/majors/compare`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ major1, major2 })
                });

                const data = await response.json();

                resultDiv.style.display = 'block';
                resultDiv.innerHTML = `
                    <div style="margin-bottom: 12px;">
                        <strong>关系类型:</strong> ${data.relationship}
                    </div>
                    <div style="margin-bottom: 12px;">
                        <strong>同一大类:</strong> ${data.same_category ? '是' : '否'}
                    </div>
                    ${data.path.length > 0 ? `
                        <div>
                            <strong>关系路径:</strong>
                            <div class="compare-path">
                                ${data.path.map((node, i) => `
                                    ${i > 0 ? '<span class="path-arrow">→</span>' : ''}
                                    <span class="path-node">${node}</span>
                                `).join('')}
                            </div>
                        </div>
                    ` : '<p style="color: #888;">暂无直接关联路径</p>'}
                `;
            } catch (e) {
                resultDiv.style.display = 'block';
                resultDiv.innerHTML = `<p style="color: #dc3545;">对比失败: ${e.message}</p>`;
            }
        }

        // 导出报告
        async function exportReport(format) {
            alert(`导出${format.toUpperCase()}功能需要在后端实现后使用`);
        }

        // 切换标签
        function switchTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));

            event.target.classList.add('active');
            document.getElementById(tab + 'Tab').classList.add('active');
        }

        // 页面加载时检查状态
        checkStatus();
    </script>
</body>
</html>
