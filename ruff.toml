# See https://docs.astral.sh/ruff/settings/
line-length = 100
target-version = "py311"

[lint]
select = [
  "E",     # pycodestyle errors
  "W",     # pycodestyle warnings
  "F",     # Pyflakes
  "I",     # isort
  "UP",    # pyupgrade
  "B",     # flake8-bugbear
  "C4",    # flake8-comprehensions
  "SIM",   # flake8-simplify
]
ignore = [
  "E501",  # line too long (handled by formatter)
]