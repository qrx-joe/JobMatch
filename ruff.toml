# See https://docs.astral.sh/ruff/settings/
line-length = 100
target-version = "py311"

[lint]
select = [
  "E",     # pycodestyle errors
  "W",     # pycodestyle warnings
  "F",     # Pyflakes
  "I",     # isort
  "UP",    # pyupgrade
  "B",     # flake8-bugbear
  "C4",    # flake8-comprehensions
  "SIM",   # flake8-simplify
]
ignore = [
  "E501",  # line too long (handled by formatter)
  "SIM102",  # nested if - requires manual refactor
  "E722",  # bare except - requires manual fix
  "E402",  # module level import not at top - requires restructuring
  "B007",  # unused loop variable - requires renaming to _
  "B904",  # raise from in except - requires manual fix
  "B008",  # File call in argument defaults - FastAPI/Starlette pattern
]